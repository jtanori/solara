version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Hermosillo
    labels:
      - type:deps
      - area:infra
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Hermosillo
    labels:
      - type:deps
      - area:infra
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
