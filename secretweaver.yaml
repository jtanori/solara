# SecretWeaver schema for Solara (metadata only; never secret values).
#
# Stages:
#   local       normal local development (.env)
#   local-pilot the bounded genuine-sampling pilot; inherits local and makes the
#               READINGS_* execution inputs required. Generation flags stay off.
#   staging     .env.staging (local mirror of Vercel Preview, branch staging)
#   production  .env.production (local mirror of Vercel Production)
#
# Vercel "Sensitive" variables are write-only: `vercel env pull` writes them
# empty, so restore them from their source and validate here. SecretWeaver 0.2.0
# has a `vercel` provider, but it does not manage branch-scoped records yet
# (jtanori/SecretSurfer#127); this project needs Preview + branch `staging`
# (jtanori/solara#255), so the local mirror is the source of truth until then.
#
# Validate locally:
#   secretweaver check
#   secretweaver validate --stage local
#   secretweaver validate --stage local-pilot
#
# The schema is safe to commit. .env* files are not.

version: "1"

project:
  name: "solara"
  description: "Solar Return horoscope app — local, pilot, staging and production secrets"

stages:
  local:
    description: "Local development"
    providers:
      - type: env_file
        path: ".env"

  local-pilot:
    description: "Bounded genuine-sampling pilot (one core and one rich sample, es)"
    inherits_from: local

  staging:
    description: "Local mirror of Vercel Preview (branch staging); Sensitive values are write-only in Vercel"
    providers:
      - type: env_file
        path: ".env.staging"

  production:
    description: "Local mirror of Vercel Production"
    providers:
      - type: env_file
        path: ".env.production"

  # When SecretSurfer supports branch-scoped records (SecretSurfer#127), this is
  # the remote counterpart of `staging`; `pull --stage staging-vercel --output
  # .env.staging` would fill the mirror without deleting human-entered secrets.
  # Until then, keep the values in `.env.staging` and use the Vercel CLI for the
  # branch scope (#255).
  # staging-vercel:
  #   description: "Vercel Preview remote (requires VERCEL_TOKEN)"
  #   inherits_from: staging
  #   providers:
  #     - type: vercel
  #       project_id: "prj_..."
  #       target: ["preview"]
  #       git_branch: "staging"
  #       token_env_var: "VERCEL_TOKEN"

secrets:
  DATABASE_URL:
    description: "PostgreSQL connection string (pooled for the app); Vercel Sensitive values pull empty, so keep the real value local"
    required: [local, staging, production]
    format: url
    pattern: "^postgres(ql)?://"
    example: "postgresql://user:pass@localhost:5432/app_db"
    sensitive: true
    tags: [database, core]

  DATABASE_URL_DIRECT:
    description: "Direct (non-pooled) PostgreSQL URL for migrations"
    required: [staging, production]
    format: url
    pattern: "^postgres(ql)?://"
    sensitive: true
    tags: [database, deploy]

  APP_DEPLOY_ENV:
    description: "Derived deployment identity for the database guard"
    optional: [local, local-pilot, staging, production]
    format: enum
    enum_values: [local, staging, preview, production]
    sensitive: false
    tags: [database, config]

  PROD_DB_ENDPOINT:
    description: "Production Neon endpoint label (first hostname label, -pooler stripped)"
    required: [production]
    optional: [local, local-pilot, staging]
    pattern: "^[a-z0-9-]{1,128}$"
    sensitive: false
    tags: [database, deploy]

  STAGING_DB_ENDPOINT:
    description: "Staging Neon endpoint label (first hostname label, -pooler stripped)"
    required: [staging]
    optional: [local, local-pilot, production]
    pattern: "^[a-z0-9-]{1,128}$"
    sensitive: false
    tags: [database, deploy]

  ALLOW_PREVIEW_ON_STAGING:
    description: "Transitional read-only staging exception; leave unset for strict previews"
    optional: [local, local-pilot, staging, production]
    format: enum
    enum_values: ["0", "1"]
    sensitive: false
    tags: [database, deploy]

  DB_POOL_MAX:
    description: "App pool cap per process (default 5, max 20)"
    optional: [local, staging, production]
    format: integer
    sensitive: false
    tags: [database, config]

  DB_COORDINATION_POOL_MAX:
    description: "Coordination pool cap per process (default 3, max 10)"
    optional: [local, staging, production]
    format: integer
    sensitive: false
    tags: [database, config]

  LIFECYCLE_ADVISORY_COMPAT:
    description: "Opt-in old/new advisory-lock overlap; keep 0"
    optional: [local, staging, production]
    format: enum
    enum_values: ["0", "1"]
    sensitive: false
    tags: [database, config]

  APP_URL:
    description: "Canonical public origin"
    required: [local, staging, production]
    format: url
    example: "https://www.thanatos.mx"
    sensitive: false
    tags: [core, config]

  STRIPE_SECRET_KEY:
    description: "Stripe server-side secret key"
    required: [staging, production]
    pattern: "^sk_(test|live)_"
    example: "sk_test_..."
    sensitive: true
    tags: [billing, third-party]

  STRIPE_WEBHOOK_SECRET:
    description: "Stripe webhook signing secret"
    required: [staging, production]
    pattern: "^whsec_"
    example: "whsec_..."
    sensitive: true
    tags: [billing, third-party]

  STRIPE_PRICE_ID_MXN:
    description: "Stripe MXN monthly price ID"
    required: [staging, production]
    pattern: "^price_"
    example: "price_..."
    sensitive: false
    tags: [billing, config]

  STRIPE_PRICE_ID_USD:
    description: "Stripe USD monthly price ID (optional; MXN is the default)"
    optional: [staging, production]
    pattern: "^price_"
    example: "price_..."
    sensitive: false
    tags: [billing, config]

  STRIPE_PREMIUM_PRICE_IDS:
    description: "Optional comma-separated legacy Premium price IDs"
    optional: [local, staging, production]
    sensitive: false
    tags: [billing, config]

  OPEN_METEO_API_KEY:
    description: "Optional commercial Open-Meteo server key"
    optional: [local, staging, production]
    sensitive: true
    tags: [maps, third-party]

  NEXT_PUBLIC_MAP_TILE_URL:
    description: "Public map-tile URL template (never a private secret)"
    optional: [local, staging, production]
    sensitive: false
    tags: [maps, public]

  NEXT_PUBLIC_MAP_ATTRIBUTION:
    description: "Public plain-text map attribution"
    optional: [local, staging, production]
    sensitive: false
    tags: [maps, public]

  PLACES_HOURLY_BUDGET:
    description: "Maximum upstream geocoding calls per hour (default 1000)"
    optional: [local, staging, production]
    format: integer
    sensitive: false
    tags: [maps, config]

  MAIL_TRANSPORT:
    description: "Local outbox or a hosted mail provider"
    required: [staging, production]
    format: enum
    enum_values: [outbox, resend, postmark]
    sensitive: false
    tags: [mail, config]

  MAIL_FROM:
    description: "From address for transactional mail"
    required: [staging, production]
    example: "Solara <no-reply@thanatos.mx>"
    sensitive: false
    tags: [mail, config]

  MAIL_REPLY_TO:
    description: "Reply-to address for transactional mail"
    optional: [local, staging, production]
    example: "info@thanatos.mx"
    sensitive: false
    tags: [mail, config]

  RESEND_API_KEY:
    description: "Resend API key when MAIL_TRANSPORT=resend"
    optional: [local, staging, production]
    sensitive: true
    tags: [mail, third-party]

  POSTMARK_SERVER_TOKEN:
    description: "Postmark server token when MAIL_TRANSPORT=postmark"
    optional: [local, staging, production]
    sensitive: true
    tags: [mail, third-party]

  CSP_MODE:
    description: "Content-Security-Policy rollout mode"
    optional: [local, staging, production]
    format: enum
    enum_values: [report-only, enforce]
    sensitive: false
    tags: [security, config]

  ALLOW_LOCAL_SEED:
    description: "Local-only seed guard; never set in staging or production"
    optional: [local]
    format: boolean
    sensitive: false
    tags: [local-only]

  ALLOW_LOCAL_SEED_IN_CI:
    description: "CI-only seed guard for a disposable 127.0.0.1 database"
    optional: [local]
    format: boolean
    sensitive: false
    tags: [local-only]

  LOCAL_SEED_PASSWORD:
    description: "Shared password for local seeded accounts"
    optional: [local]
    min_length: 12
    sensitive: true
    tags: [local-only]

  VERCEL_AUTOMATION_BYPASS_SECRET:
    description: "Bypass token for protected Vercel preview checks (local/GitHub/Stripe endpoint only; never a Vercel app env var)"
    optional: [local, staging, production]
    sensitive: true
    tags: [deploy, third-party]

  READINGS_GENERATION_ENABLED:
    description: "Global generation kill switch; keep off for the pilot"
    optional: [local, staging, production]
    format: boolean
    sensitive: false
    tags: [readings, config]

  READINGS_PAID_GENERATION_ENABLED:
    description: "Paid generation switch; keep off for the pilot"
    optional: [local, staging, production]
    format: boolean
    sensitive: false
    tags: [readings, config]

  READINGS_PROVIDER:
    description: "Provider adapter; chat-completions for a live pilot"
    required: [local-pilot]
    pattern: "^(chat-completions|fixture)$"
    example: "chat-completions"
    sensitive: false
    tags: [readings, pilot]

  READINGS_CHEAP_MODEL:
    description: "Cheap-tier model ID"
    required: [local-pilot]
    pattern: "^[a-zA-Z0-9._:/-]{1,128}$"
    sensitive: false
    tags: [readings, pilot]

  READINGS_STRONG_MODEL:
    description: "Strong-tier model ID (guidance)"
    required: [local-pilot]
    pattern: "^[a-zA-Z0-9._:/-]{1,128}$"
    sensitive: false
    tags: [readings, pilot]

  READINGS_MODEL_PRICES:
    description: "MXN per million tokens; prices the model and every served alias"
    required: [local-pilot]
    format: json
    example: '{"model-id":{"inputMxnPerMillion":15,"outputMxnPerMillion":60}}'
    sensitive: false
    tags: [readings, pilot]

  READINGS_API_BASE_URL:
    description: "Canonical HTTPS provider base URL (no credentials/query/fragment)"
    required: [local-pilot]
    format: url
    pattern: "^https://"
    sensitive: false
    tags: [readings, pilot]

  READINGS_OPENCODE_SESSION:
    description: "Stable OpenCode Go session id, sent as x-opencode-session"
    required: [local-pilot]
    optional: [local, staging, production]
    pattern: "^[A-Za-z0-9._:-]{1,128}$"
    sensitive: false
    tags: [readings, pilot]

  READINGS_THINKING:
    description: "Provider thinking mode; DeepSeek needs disabled to leave room for JSON output"
    required: [local-pilot]
    optional: [local, staging, production]
    format: enum
    enum_values: [enabled, disabled]
    sensitive: false
    tags: [readings, pilot]

  READINGS_PROCESSOR_PROFILE:
    description: "Non-secret processor policy and verified input metering contract"
    required: [local-pilot]
    format: json
    example: '{"id":"processor-id","name":"Actual processor name","policyVersion":"v1","inputTokenLimits":{"model-id":128000},"servedModels":{"model-id":["served-id"]}}'
    sensitive: false
    tags: [readings, pilot]

  READINGS_API_KEY:
    description: "Provider API key; add last, directly in the secret manager"
    required: [local-pilot]
    min_length: 8
    sensitive: true
    tags: [readings, pilot, third-party]

  READINGS_REQUEST_TIMEOUT_MS:
    description: "Per-attempt deadline in ms (integer 1..15000, default 15000)"
    optional: [local-pilot]
    format: integer
    sensitive: false
    tags: [readings, pilot]

  READINGS_PAID_EXECUTOR:
    description: "Set only for the bound/qualified database worker"
    optional: [local, staging, production]
    format: enum
    enum_values: [database-worker-v1]
    sensitive: false
    tags: [readings, config]

  READINGS_PAID_PROFILE:
    description: "Paid edition profile"
    optional: [local, staging, production]
    format: enum
    enum_values: [paid-core-v1, paid-rich-v1]
    sensitive: false
    tags: [readings, config]

groups:
  database:
    description: "Database and pool configuration"
    secrets: [DATABASE_URL, DATABASE_URL_DIRECT, APP_DEPLOY_ENV, PROD_DB_ENDPOINT, STAGING_DB_ENDPOINT, ALLOW_PREVIEW_ON_STAGING, DB_POOL_MAX, DB_COORDINATION_POOL_MAX, LIFECYCLE_ADVISORY_COMPAT]
  billing:
    description: "Stripe billing"
    secrets: [STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID_MXN, STRIPE_PRICE_ID_USD, STRIPE_PREMIUM_PRICE_IDS]
  mail:
    description: "Transactional mail"
    secrets: [MAIL_TRANSPORT, MAIL_FROM, MAIL_REPLY_TO, RESEND_API_KEY, POSTMARK_SERVER_TOKEN]
  maps:
    description: "Geocoding and map tiles"
    secrets: [OPEN_METEO_API_KEY, NEXT_PUBLIC_MAP_TILE_URL, NEXT_PUBLIC_MAP_ATTRIBUTION, PLACES_HOURLY_BUDGET]
  readings:
    description: "AI reading generation"
    secrets: [READINGS_GENERATION_ENABLED, READINGS_PAID_GENERATION_ENABLED, READINGS_PROVIDER, READINGS_CHEAP_MODEL, READINGS_STRONG_MODEL, READINGS_MODEL_PRICES, READINGS_API_BASE_URL, READINGS_OPENCODE_SESSION, READINGS_THINKING, READINGS_PROCESSOR_PROFILE, READINGS_API_KEY, READINGS_REQUEST_TIMEOUT_MS, READINGS_PAID_EXECUTOR, READINGS_PAID_PROFILE]
  readings-pilot:
    description: "Required only for the bounded genuine-sampling pilot"
    secrets: [READINGS_PROVIDER, READINGS_CHEAP_MODEL, READINGS_STRONG_MODEL, READINGS_MODEL_PRICES, READINGS_API_BASE_URL, READINGS_OPENCODE_SESSION, READINGS_THINKING, READINGS_PROCESSOR_PROFILE, READINGS_API_KEY]
  deploy:
    description: "Deployment and preview access"
    secrets: [VERCEL_AUTOMATION_BYPASS_SECRET]
  local-only:
    description: "Local seed guard; never set in hosting"
    secrets: [ALLOW_LOCAL_SEED, ALLOW_LOCAL_SEED_IN_CI, LOCAL_SEED_PASSWORD]
